[project]
name = "mcp-maps"
version = "0.1.0"
description = "Routes and navigation (Google Directions) with per-household saved places, as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kuba" }]
dependencies = [
    "jarvis-mcp-kit @ git+https://github.com/jaknow01/jarvis-mcp-kit.git@v0.2.0",
    "googlemaps>=4.10,<5",
    "tzdata",
]

[project.scripts]
mcp-maps = "mcp_maps.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_maps"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
